# License manifest for motion-capture clips in assets/animations/.
#
# Third-party animation files are NEVER committed (see .gitignore). Download them yourself
# (e.g. Mixamo FBX "Without Skin", the CMU Graphics Lab Motion Capture Database BVH conversions)
# into this folder and describe each file here so the source and license travel with your
# project. `tags` decide which story actions the clip performs (wave, point, talk, walk, idle,
# jump, cheer, shrug, laugh, cry, think, clap, pick_up, run, tiptoe, ...). If tags are omitted,
# they are guessed from the file name ("Waving.fbx" -> wave).
#
# Mixamo: free for personal/commercial use in projects, but the files may not be redistributed
#         on their own. Keep them local.
# CMU:    "free for all uses"; credit "mocap.cs.cmu.edu" (funded by NSF EIA-0196217).
#
# The built-in clips (procedural, generated by StoryForge) are CC0 and need no entry.
clips:
  # - file: Waving.fbx
  #   source: https://www.mixamo.com (downloaded by me, "Waving", In Place, 30 fps, Without Skin)
  #   license: Mixamo / Adobe General Terms - use in projects, no redistribution of raw files
  #   tags: [wave]
  # - file: cmu/02_01.bvh
  #   source: CMU Graphics Lab Motion Capture Database, subject 02 trial 01 (walk)
  #   license: free for all uses, credit mocap.cs.cmu.edu
  #   tags: [walk]
  #   bone_map: {}        # optional overrides {canonical_bone: source_bone}
  #   enabled: true
